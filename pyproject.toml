# Deployment manifest for the web app (Vercel reads this). The DSP pipeline's own dependencies stay in
# requirements.txt; .vercelignore keeps that file and the pipeline out of the web deployment.
[project]
name = "sentinelspread-web"
version = "1.0.0"
description = "SentinelSpread web app: steganography, watermarking and cryptography workbench"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "cryptography>=42",
    "pillow>=10",
    "numpy>=1.26",
    "scipy>=1.11",
]

[tool.vercel]
entrypoint = "app:app"
