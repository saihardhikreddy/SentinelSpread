# SentinelSpread System Configuration

system:
  mode: "simulation"        # "simulation" or "hardware"
  sample_rate: 1000000      # 1 MHz sample rate
  carrier_freq: 915000000   # 915 MHz ISM band

crypto:
  aes_key_bits: 256         # AES-256
  rsa_key_bits: 2048        # RSA 2048 key size
  cipher_mode: "GCM"        # AES-GCM for authenticated encryption

dsss:
  spreading_factor: 16      # 16 chips per symbol
  pn_seed: 42341            # Test/fallback seed only (production derives seed from AES session key)

modem:
  scheme: "BPSK"            # "BPSK" or "QPSK"
  rrc_alpha: 0.35           # Roll-off factor
  sps: 4                    # Samples per symbol

channel:
  snr_db: 10.0              # Default AWGN channel SNR in dB

hardware:
  tx_device: "plutosdr"     # Adalm Pluto TX
  rx_device: "rtl"          # RTL-SDR RX
